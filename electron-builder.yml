appId: io.github.ztbytd.xuding
productName: 续订
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3-multiple-ciphers/prebuilds/**/*
publish:
  provider: github
  owner: ztbytd
  repo: xuding
  releaseType: draft
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/third-party-notices.txt
    to: third-party-notices.txt
npmRebuild: false
win:
  icon: resources/icon.ico
  executableName: xuding
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: xuding-${version}-windows-${arch}-setup.${ext}
